name: Build DDLC Mod Manager

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q DDLCModManager/ddlc_mod_manager
      - run: python -m unittest discover -s DDLCModManager/tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r DDLCModManager/build/requirements-build.txt
      - run: pwsh -File DDLCModManager/build/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DDLCModManager-windows-x64
          path: DDLCModManager/dist/windows/DDLCModManager.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-tk
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r DDLCModManager/build/requirements-build.txt
          . .venv/bin/activate
          bash DDLCModManager/build/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DDLCModManager-linux-x86_64
          path: DDLCModManager/dist/DDLCModManager-linux-*.tar.gz
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r DDLCModManager/build/requirements-build.txt
      - run: bash DDLCModManager/build/build_macos.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: DDLCModManager-macos-x86_64
          path: DDLCModManager/dist/DDLCModManager-macos-x86_64.zip
          if-no-files-found: error

  macos-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r DDLCModManager/build/requirements-build.txt
      - run: bash DDLCModManager/build/build_macos.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: DDLCModManager-macos-arm64
          path: DDLCModManager/dist/DDLCModManager-macos-arm64.zip
          if-no-files-found: error
