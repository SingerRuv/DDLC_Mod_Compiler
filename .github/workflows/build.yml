name: Build CompilarDDLC

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r CompilarDDLC/build/requirements-build.txt
      - run: pwsh -File CompilarDDLC/build/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CompilarDDLC-windows-x64
          path: CompilarDDLC/dist/windows/CompilarDDLC.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-tk
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r CompilarDDLC/build/requirements-build.txt
          . .venv/bin/activate
          bash CompilarDDLC/build/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CompilarDDLC-linux-x86_64
          path: CompilarDDLC/dist/CompilarDDLC-linux-*.tar.gz
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r CompilarDDLC/build/requirements-build.txt
      - run: bash CompilarDDLC/build/build_macos.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: CompilarDDLC-macos-x86_64
          path: CompilarDDLC/dist/CompilarDDLC-macos-x86_64.zip
          if-no-files-found: error

  macos-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r CompilarDDLC/build/requirements-build.txt
      - run: bash CompilarDDLC/build/build_macos.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: CompilarDDLC-macos-arm64
          path: CompilarDDLC/dist/CompilarDDLC-macos-arm64.zip
          if-no-files-found: error
